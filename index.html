<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>coum&</title>

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">

  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- ЭКРАН АВТОРИЗАЦИИ ПО CID -->
  <div id="auth-screen" class="screen">
    <div class="auth-box">
      <div id="auth-logo" class="auth-logo-title">coum&</div>
      <div class="auth-input-row">
        <input type="password" id="auth-input" autofocus autocomplete="off" placeholder="CID" />
        <div id="auth-error" class="hidden">✕</div>
      </div>
    </div>
  </div>

  <!-- РАБОЧИЙ ЭКРАН -->
  <div id="app-screen" class="screen hidden">
    <!-- Левая панель (список чатов) -->
    <aside class="sidebar" id="app-sidebar">
      <div class="sidebar-top">
        <div class="user-profile">
          <div class="user-display-name" id="my-display-name">---</div>
          <div class="user-fixed-cid" id="my-fixed-cid">CID: ---</div>
        </div>
        <button id="edit-name-btn">[ИЗМЕНИТЬ]</button>
      </div>

      <div class="peers-list" id="peers-list"></div>

      <div class="sidebar-bottom">
        <button id="open-settings-btn">[НАСТРОЙКИ]</button>
      </div>
    </aside>

    <!-- Область чата -->
    <main class="chat-area" id="app-chat-area">
      <div class="chat-topbar">
        <button id="mobile-back-btn" class="mobile-back-btn">←</button>
        <span id="active-peer-header">---</span>
      </div>
      <div class="messages-viewport" id="messages-container"></div>
      
      <!-- Форма отправки с кнопкой скрепки -->
      <form class="message-form" id="message-form">
        <input type="file" id="image-file-input" accept="image/*" class="hidden" />
        <button type="button" id="attach-btn" title="Прикрепить скриншот/фото">📎</button>
        <input type="text" id="message-input" autocomplete="off" placeholder="Сообщение или вставьте скриншот (Ctrl+V)..." />
        <button type="submit">ОТПРАВИТЬ</button>
      </form>
    </main>
  </div>

  <!-- ПРОСМОТР КАРТИНКИ НА ВЕСЬ ЭКРАН -->
  <div id="image-viewer-modal" class="modal-overlay hidden">
    <button id="close-viewer-btn" class="viewer-close-btn">[ЗАКРЫТЬ]</button>
    <img id="viewer-img" src="" alt="Изображение" />
  </div>

  <!-- МОДАЛКА НАСТРОЕК -->
  <div id="settings-modal" class="modal-overlay hidden">
    <div class="settings-window">
      <div class="settings-header">
        <span>НАСТРОЙКИ</span>
        <button id="settings-close-btn">[X]</button>
      </div>

      <div class="settings-section">
        <label class="settings-label">МАСШТАБ ИНТЕРФЕЙСА:</label>
        <div class="scale-options">
          <button class="scale-btn" data-scale="0.8">80%</button>
          <button class="scale-btn" data-scale="0.9">90%</button>
          <button class="scale-btn active" data-scale="1.0">100%</button>
          <button class="scale-btn" data-scale="1.15">115%</button>
          <button class="scale-btn" data-scale="1.3">130%</button>
        </div>
      </div>

      <div class="settings-section">
        <label class="settings-label">ВЫБОР ТЕМЫ:</label>
        <div class="theme-grid">
          <button class="theme-select-btn" data-theme="black">Чёрная</button>
          <button class="theme-select-btn" data-theme="gray">Серая</button>
          <button class="theme-select-btn" data-theme="light">Светлая</button>
          <button class="theme-select-btn" data-theme="lime">Салатовая</button>
          <button class="theme-select-btn" data-theme="purple">Фиолетовая</button>
          <button class="theme-select-btn" data-theme="red">Красная</button>
          <button class="theme-select-btn" data-theme="yellow">Жёлтая</button>
          <button class="theme-select-btn" data-theme="pink">Розовая</button>
          <button class="theme-select-btn" data-theme="ukraine">Украинская</button>
        </div>
      </div>

      <div class="settings-section">
        <label class="settings-label">СВОЯ ТЕМА:</label>
        <div class="custom-theme-controls">
          <div class="color-picker-item">
            <span>Фон:</span>
            <input type="color" id="custom-color-bg" value="#0d1117" />
          </div>
          <div class="color-picker-item">
            <span>Панели:</span>
            <input type="color" id="custom-color-panel" value="#161b22" />
          </div>
          <div class="color-picker-item">
            <span>Текст:</span>
            <input type="color" id="custom-color-text" value="#e6edf3" />
          </div>
          <div class="color-picker-item">
            <span>Акцент:</span>
            <input type="color" id="custom-color-accent" value="#58a6ff" />
          </div>
          <button id="apply-custom-theme-btn">ПРИМЕНИТЬ СВОЮ</button>
        </div>
      </div>

      <div class="settings-section danger-zone">
        <button id="settings-logout-btn">ВЫЙТИ ИЗ АККАУНТА</button>
      </div>
    </div>
  </div>

  <!-- МОДАЛКА ПАРОЛЯ АДМИНА -->
  <div id="admin-auth-modal" class="modal-overlay hidden">
    <div class="modal-window">
      <input type="password" id="admin-pass-input" placeholder="v" autocomplete="off" />
    </div>
  </div>

  <!-- АДМИН-КОНСОЛЬ -->
  <div id="admin-panel" class="modal-overlay hidden">
    <div class="admin-window">
      <div class="admin-header">
        <span>КОНСОЛЬ УПРАВЛЕНИЯ</span>
        <button id="admin-close-btn">[X]</button>
      </div>
      
      <div class="admin-controls">
        <button id="generate-cid-btn">СГЕНЕРИРОВАТЬ CID</button>
        <span id="last-generated-cid">CID: ---</span>
        <button id="copy-cid-btn" class="hidden">СКОПИРОВАТЬ</button>
      </div>

      <div class="admin-list-title">СПИСОК ВСЕХ CID В ОБЛАКЕ:</div>
      <div class="admin-cid-list" id="admin-cid-list"></div>
    </div>
  </div>

  <!-- ПОДТВЕРЖДЕНИЕ УДАЛЕНИЯ ПОЛЬЗОВАТЕЛЯ -->
  <div id="delete-confirm-modal" class="modal-overlay hidden">
    <div class="confirm-window">
      <div class="confirm-title">УДАЛЕНИЕ CID НАВСЕГДА</div>
      <div class="confirm-desc">
        Пользователь исчезнет навсегда без возможности восстановления.<br>
        Чтобы подтвердить, введите фразу:<br>
        <strong>да я хочу этого</strong>
      </div>
      <input type="text" id="delete-phrase-input" autocomplete="off" placeholder="Введите фразу..." />
      <div class="confirm-actions">
        <button id="confirm-delete-btn" disabled>УДАЛИТЬ</button>
        <button id="cancel-delete-btn">ОТМЕНА</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  
  <script src="js/app.js"></script>
</body>
</html>
